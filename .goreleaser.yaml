# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.1.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This is the first release. It hasn't had an outside review, and it can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - `install.sh`, as `curl | sudo bash`, on clean virtual machines: Ubuntu 24.04 (amd64 and arm64), Ubuntu 25.10, Debian 12 and Fedora 43 (arm64). Each reached the Tailscale login link. On Ubuntu 24.04 it was also given an auth key: 13 seconds to install, then Bield joined a real tailnet, served HTTPS there, and made the key's owner its admin.
    - Host mode on Ubuntu 24.04 with a real Tailscale, with `BIELD_TAILSCALE=host` and `tailscale set --operator=bield`: it listened on the machine's tailnet IPs and served HTTPS.
    - The Docker image on arm64: `compose.yaml` with an auth key (healthy in 8 seconds, joined the tailnet), and `serve --demo`.
    - The macOS arm64 archive, with `serve --demo`. The agent on a Mac, from the hub's install command to a running LaunchAgent that reported live metrics, and its removal.
    - The systemd service with its sandbox in effect (`ProtectSystem=strict`, `NoNewPrivileges` and the rest), on Debian 12 in a privileged container: it starts, writes its database and serves the setup page.
    - Go and web tests on every change, against a fake tailnet and a fake SSH server, and a browser smoke test of the demo.

    ### What has not been run

    - Logging in with the setup page's link or QR code. The tests used auth keys.
    - Headscale against a real server.
    - The terminal, files and Docker pages against a real machine over SSH, and so anything past the login under the service's sandbox.
    - Bield on a Raspberry Pi or other arm64 hardware. The arm64 runs were virtual machines on Apple silicon.
    - Fedora with SELinux enforcing.
    - Upgrading from an earlier release.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
