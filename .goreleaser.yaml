# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.4.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This release adds [VS Code in the browser](https://github.com/manasseh-fikadu/bield/blob/main/docs/vscode.md): open a machine in VS Code from its page in Bield, with nothing to sign in to and no work for Bield's own machine.

    - An admin installs it from the machine's page, or with `bield editor install`. The machine downloads code-server from GitHub, and Bield checks the download against the SHA-256 it pins for that version before it installs it. It needs SSH access, Linux or macOS on x86-64 or ARM64 with glibc, and about 1 GB free in the home folder.
    - **Open VS Code** on the machine's page, or **Open in VS Code** in the file manager for the folder you're in, opens it in a new tab. code-server runs as the user Bield logs in as, listens on a private socket in that user's home and nowhere on the network, and stops by itself after 30 minutes with no one connected.
    - Each machine's editor is served on a port of Bield's own, from 4710 (`BIELD_EDITOR_PORTS`), so what VS Code runs in your browser can't reach Bield's API or another machine's editor. **If your tailnet policy only lets people reach port 443 of Bield, allow ports 4710 to 4799 too.** The editor is on the tailnet only, not behind a Public URL.
    - It's for admins in person, like the terminal: viewers and API tokens can't open it. Installs, updates, opens, closes, stops and removals are in the activity log.
    - Extensions come from Open VSX, not Microsoft's marketplace, so Copilot, Remote - SSH and Live Share aren't there.

    The agent doesn't change (it's still 1.4.0), so there's nothing to update on your machines. Bield adds a table for the editors when it starts, which needs no action from you.

    Bield can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - VS Code on Headscale 0.29.7 over plain HTTP, with an admin and a viewer opening it from their own machines in Chromium, and the machine Bield runs on as the target: installing from the card, opening it from the file manager at a folder, editing and saving a file, the terminal, installing an extension from Open VSX, stopping it and starting it again from its own page, and removing it with and without its settings.
    - What the editor's port refuses: a viewer, an admin demoted while their editor was open (cut off within 10 seconds), API tokens, requests from other sites, and a machine with no SSH access.
    - The install, start, stop and remove scripts with a real `sh`, and the API, the editor's port and `bield editor` against a fake tailnet and SSH server in Go tests.

    ### What has not been run

    - VS Code over HTTPS, which turns on webviews and the clipboard that plain HTTP turns off, and a Tailscale tailnet: the test tailnet was Headscale.
    - Tailscale SSH with Tailscale's own control server as the way Bield reaches the editor. Headscale allows it for `accept` rules.
    - A Mac as the machine VS Code runs on, a machine other than the one Bield runs on, and Safari.
    - What the [v0.5.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.5.0) list under "What has not been run". Nothing in this release changes that.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
