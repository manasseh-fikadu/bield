# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.4.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This release is about how traffic reaches your machines.

    - **Tags.** Devices show all their Tailscale tags, on the Devices page, on a device's page and in `bield devices`. **Tag** on the Devices page and `bield devices --tag server` pick the machines with one. Bield only shows tags; you set them in Tailscale.
    - **Routes.** **Route** on the Devices page and `bield devices --path derp` pick the machines Bield reaches one way: directly, through one of Tailscale's DERP relays, or through a peer relay.
    - **An alert when a machine falls back to a relay.** A machine that Bield reached directly in the last week, and that answers five pings in a row through DERP or a peer relay, raises a warning. It resolves a minute after the machine is direct again. It's on for servers only: each machine's settings have an **Alert when relayed** switch, `bield devices set --alert-relayed` changes it, and **Relayed connection** in Settings turns it off for all.
    - **A peer relay suggestion.** When Bield reaches machines through DERP, the new **Peer relay** page suggests one of your machines to be a [peer relay](https://tailscale.com/kb/1591/peer-relays) for them, which is often faster: a computer Bield reaches directly, best a server at a public address. It gives the command to run on it and the grant for your tailnet policy file, which Bield can't edit. `bield relay` prints the same. Bield only sees its own connections, so it can't tell whether the relay will help your machines reach each other. It doesn't suggest one on Headscale.
    - **Better route readings.** A machine that's direct or on a peer relay no longer shows as relayed through DERP. After a quiet minute, the first ping often comes back through DERP while Tailscale finds the direct path again, so Bield now pings again for a few seconds, as `tailscale ping` does.

    The agent doesn't change (it's still 1.4.0). Bield adds a table and a column to its database when it starts, which needs no action from you.

    Bield can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - On a real Tailscale tailnet, with one machine made a peer relay: a machine that was direct, then cut off from everything but the relay, showed as on a peer relay every minute. The alert opened at the fifth reading, followed the machine to DERP when the relay was blocked too, and resolved a minute after it was direct again. A machine that was never direct got no alert.
    - On the same tailnet, before the route fix, machines on a peer relay and a server reached directly showed as on DERP, and the server got a false alert. After it, they showed their real routes.
    - The Peer relay page and `bield relay` on that tailnet, with a machine cut off from all UDP: it showed as on DERP, and the suggested machine, command and grant were right.
    - The new pages in the demo at phone and desktop widths, the alert and the suggestion in Go tests, and the new CLI flags and command against a fake tailnet and a stub.

    ### What has not been run

    - This release on the live tailnet, before it was published.
    - Following the suggestion all the way for a real machine behind a strict NAT, and peer relays on Headscale.
    - What the [v0.6.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.6.0) list under "What has not been run", apart from HTTPS and a Tailscale tailnet, which v0.6.1's run covered. Nothing in this release changes that.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
