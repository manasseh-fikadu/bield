# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.4.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This release adds [an MCP server](https://github.com/manasseh-fikadu/bield/blob/main/docs/mcp.md) for AI agents such as Claude Code, Codex and Cursor, and fixes installing the agent on machines whose login has no systemd session, such as DietPi over Dropbear.

    - `bield mcp` runs next to the agent and gives it typed tools, made from the command line's commands, with the roles the web app has. `claude mcp add bield -- bield mcp` sets it up in Claude Code.
    - It is read-only unless you start it with `--allow-changes`, and the activity log says when a change came from MCP.
    - Installing the agent as root now makes a system service, which needs no login session and keeps running after you log out. Other users get their running systemd found for them. If systemd can't run the agent, the installer says what to do before it changes anything, instead of leaving a machine that sent one heartbeat and went quiet.
    - Re-running the install as root replaces a user service left by an older install, so a machine doesn't end up with two agents.

    The agent itself doesn't change (it's still 1.4.0), so there's nothing to update on machines where it already runs. There is no database change. An MCP client on a tagged server, in CI or on the machine Bield runs on can't use `bield mcp` yet, since Bield doesn't know who they are. Scoped tokens for them are still to come.

    Bield can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - `bield mcp` with Claude Code against the demo: read-only, it listed the devices, found the failing check and read its history with no shell command, and saw only read-only tools. With `--allow-changes` it acknowledged an alert, and the event said it came from MCP.
    - The same agent, read-only, against a real Bield on a real tailnet.
    - The MCP server over stdio with a fake tailnet in Go tests, and the tools that need a machine against a stub server.
    - The agent installer in a Debian 12 container with real systemd and a stand-in for Bield, logged in with no session: as root (service running, heartbeats continuing after a restart, reinstall, uninstall), as a user with no session (refused before enrolling), as a user with lingering on, and as root over an older user service.

    ### What has not been run

    - The agent installer on a real Raspberry Pi or on DietPi.
    - Codex and Cursor against `bield mcp`. Its setup for them follows their documented config.
    - The Docker and file tools called by an agent against a real machine.
    - Upgrading from v0.3.0 to this release in place.
    - What the [v0.3.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.3.0) list for the command line on a Mac and the zsh and fish completion scripts. Nothing in this release changes that.
    - What the [v0.2.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.2.0) list under "What has not been run", which is coding usage on a Mac, OpenCode read with the `sqlite3` command, and Pi on a real install. Nothing in this release changes that.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
