# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.3.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This release adds [a command line](https://github.com/manasseh-fikadu/bield/blob/main/docs/cli.md), for people and for AI agents such as Claude Code and Codex. It is the same `bield` file as the server: `bield connect https://bield.example.ts.net` on a laptop that is on your tailnet, and then `bield status`, `bield devices`, `bield alerts ack 5`, `bield docker restart nas web --yes` and about forty more, with the roles the web app has. There is nothing to log in to, because Bield sees who you are through Tailscale.

    - Every command takes `--json`, never asks a question, and exits with a code that says what went wrong. A command that stops, deletes or overwrites something does nothing without `--yes`.
    - A refusal says why, and what to do: from a tagged server, from Bield's own machine, with no role, or as a viewer.
    - The activity log says when a change came from the command line.
    - Bield adds a column to the activity log when it starts, so you don't need to do anything. A snapshot now also includes a change made a moment ago, and a page that connected while Bield was starting is no longer sent its first snapshot twice.

    The agent doesn't change (it's still 1.4.0), so there's nothing to update on your machines. An agent on a tagged server, in CI or on the machine Bield runs on can't use the command line yet, since Bield doesn't know who they are. Scoped tokens for them are the next step.

    Bield can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - The commands against a fake tailnet in Go tests: each role, each kind of refusal, `--yes`, the follow modes, and `bield connect`. Docker and files go through a stub server.
    - The commands by hand against the demo.
    - A Bield in host mode on a real tailnet, asked from the machine it runs on: the command line says that machine is anonymous and what to do.
    - `bield whoami` and `bield settings` against a Bield v0.2.1 from a machine on a real tailnet, where they ran as the signed-in admin. The commands that need the new snapshot route say that the Bield is too old.

    ### What has not been run

    - Upgrading from v0.2.1 to this release. The new column is added by a migration that the tests run on a new database.
    - The Docker and file commands against a real machine. The demo turns them off.
    - The command line on a Mac, and the zsh and fish completion scripts. Only bash was checked, and only its syntax.
    - The new command line on a second machine of a real tailnet, against this release's Bield.
    - What the [v0.2.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.2.0) list under "What has not been run", which is coding usage on a Mac, OpenCode read with the `sqlite3` command, and Pi on a real install. Nothing in this release changes that.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
