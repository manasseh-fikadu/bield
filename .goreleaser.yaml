# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.4.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This release is about AI usage: more tools read, the ones that were read before counted more exactly, and budgets.

    - **More tools.** Besides Claude Code, Codex, OpenCode and Pi, the agent now reads Gemini CLI, Grok, Muse and Antigravity. Antigravity needs Python 3 on the machine, since it keeps its counts in a binary format; the machine's card says so when it's missing. Cursor and Kiro don't write token counts on the machine, so they can't be read, which [the docs](https://github.com/manasseh-fikadu/bield/blob/main/docs/coding.md#tools-bield-doesnt-read) explain.
    - **Counted more exactly.** A Claude Code reply that a resumed session or a forked sub-agent copied into another file counts once, not once in each (about 0.7% too much on the machine it was tried on). An interrupted Codex request counts when Codex's records account for it. OpenCode's JSON files from before its database are read, a Claude Code session's calls to an advisor model count under that model, and Codex's ultrafast tier is priced at its own rates.
    - **Budgets.** **Settings**, **Alerts**, **AI usage budget** sets a budget in dollars or tokens, for all machines together or for each one, over 24 hours, 7 days or 30 days. Bield warns at 80% and raises a critical alert once it's spent, and your notification channels send them like other alerts. The **AI usage** page shows how much is used.
    - **Watch all.** The **AI usage** page turns on watching for every machine with an agent at once, as `bield ai watch` does. `bield ai unwatch --yes` turns it off everywhere.
    - **Every range on a machine's card.** A machine's **AI usage** card has every range the AI usage page has, from 24 hours to a year, and your browser remembers the one you pick.

    The agent is now 1.5.0. Update it from the Agents page; the new tools and the fixes need it. After the update it reads each machine's files again once, and what an older agent sent stays as it was. There is no database change.

    Bield can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - The agent's readers on this release's test machine's real files: Claude Code's copies came to 286 of 38,736 replies, the same as a count done another way; Codex's totals equal T3 Code's way of counting them for every session and model; OpenCode's database gives the same report through the real `sqlite3` command as through Python.
    - A real install of Pi 0.73.1, talking to a stand-in model server, whose session files the agent read right, with the cost Pi worked out.
    - The agent's tests with bash 3.2.57 and BWK awk, which macOS has, with busybox awk, and in a Linux container with FreeBSD's `stat`, `find`, `tail` and `date`.
    - Budgets, alerts and their notifications, Watch all and the card's ranges in the demo, at phone and desktop widths, and in Go tests.

    ### What has not been run

    - A Mac, and real installs of Gemini CLI, Grok, Muse and Antigravity. Their readers follow their file formats as T3 Code reads them, and were tried on made-up files.
    - This release on the live tailnet, before it was published.
    - What the [v0.7.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.7.0) list under "What has not been run". Nothing in this release changes that.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
