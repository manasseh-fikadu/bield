# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases come from tags: pushing v0.1.0 runs .github/workflows/release.yml,
# which builds the archives, a checksums file and a changelog, and pushes the
# Docker image. `goreleaser release --snapshot --clean` tries it without a tag.
version: 2

project_name: bield

before:
  hooks:
    # The web app goes into the binary, so it's built first.
    - make web

builds:
  - id: bield
    main: ./cmd/bield
    binary: bield
    tags: [ui]
    flags: [-trimpath]
    # The same stamp the Makefile makes, such as v0.1.0.
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    # Pure Go, so every target builds from here without a C toolchain.
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bield
    formats: [tar.gz]
    # install.sh builds this name from `uname`, so change them together.
    name_template: "bield_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - images: [ghcr.io/manasseh-fikadu/bield]
    dockerfile: Dockerfile
    platforms: [linux/amd64, linux/arm64]
    # A release candidate doesn't move latest or the minor version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: Bield
      org.opencontainers.image.description: A self-hosted control plane for every machine on your tailnet
      org.opencontainers.image.source: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.url: https://github.com/manasseh-fikadu/bield
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 3

release:
  # A tag like v0.1.0-rc.1 is a pre-release.
  prerelease: auto
  # Written by hand for v0.4.0, and above the generated changelog. Rewrite the
  # lists for the next release, since they say what was run for this one.
  header: |
    Bield is a self-hosted control plane for the machines on your tailnet. It's one binary, or one container, that joins your Tailscale or Headscale tailnet and shows every machine in one place: its health and history, its alerts and its containers. Admins can open a terminal, browse files and restart containers from the same page. There are no passwords, because your tailnet is the login. The [README](https://github.com/manasseh-fikadu/bield#readme) says what it does.

    This release adds [scoped API tokens](https://github.com/manasseh-fikadu/bield/blob/main/docs/cli.md#api-tokens), for the machines and agents that Tailscale can't name a person for, and lets `bield` join the tailnet by itself where Tailscale isn't installed.

    - An admin makes a token in Settings, under API tokens, or with `bield tokens create`, with a name, a role (viewer by default) and an expiry of up to a year. Bield shows it once and keeps only its hash. Use it with `BIELD_TOKEN` or `bield connect <url> --with-token`. `bield mcp` takes it too.
    - A token never does more than the admin who made it can now: demote them and their admin tokens act as viewers, remove them and their tokens stop. Revoking one stops it at once, ends the streams it opened, and keeps its name, so a name in the activity log always means one token.
    - Tokens can't open terminals, make or revoke tokens, change who has access, or change the Public URL. An admin token can still write files on your machines, which is as good as a shell there, so prefer viewer tokens and treat a leaked admin token like a leaked admin laptop.
    - Changes made with a token are in the activity log under its maker, with the token's name.
    - With an auth key in `BIELD_TS_AUTHKEY`, the command line and `bield mcp` join the tailnet inside their own process for as long as they run, so a container or a CI runner needs no Tailscale. See [Machines without Tailscale](https://github.com/manasseh-fikadu/bield/blob/main/docs/cli.md#machines-without-tailscale).

    The agent doesn't change (it's still 1.4.0), so there's nothing to update on your machines. Bield adds a table for the tokens and a column to the activity log when it starts, which needs no action from you.

    Bield can open a shell on every machine you give it SSH access to. Read the [security model](https://github.com/manasseh-fikadu/bield/blob/main/SECURITY.md) before you put it on a tailnet you care about.

    ### What has been run

    - Tokens on a real Tailscale tailnet, from Bield's own machine, which is anonymous without one: viewer and admin tokens, the routes only people can use, `bield connect --with-token`, a revoke ending a live `--follow` within seconds, and `bield mcp` with each kind of token.
    - Tokens on Headscale 0.29.7, made by a person from their own machine and used from a tagged server: a maker demoted and removed, revoking, and the Settings tab in a browser over plain HTTP.
    - `BIELD_TS_AUTHKEY` on Headscale, from a Debian container with no Tailscale in it, for the command line and `bield mcp`.
    - An independent security review of the tokens. The four things it found are fixed in this release.
    - Shell completion in bash 5.2, zsh 5.9 and fish 3.6.

    ### What has not been run

    - Making a token in the web app on a real Tailscale tailnet (it was made through the same code path, not the page).
    - `BIELD_TS_AUTHKEY` with a Tailscale auth key, as opposed to a Headscale one.
    - Codex and Cursor against `bield mcp`, and the command line on a Mac.
    - What the [v0.2.0 notes](https://github.com/manasseh-fikadu/bield/releases/tag/v0.2.0) list under "What has not been run", which is coding usage on a Mac, OpenCode read with the `sqlite3` command, and Pi on a real install. Nothing in this release changes that.

    Windows and OIDC sign-in aren't in this version. If something doesn't work, [open an issue](https://github.com/manasseh-fikadu/bield/issues/new/choose).
  footer: |
    ## Install

    ```sh
    # On a Linux server with systemd
    curl -fsSL https://raw.githubusercontent.com/manasseh-fikadu/bield/main/install.sh | sudo BIELD_VERSION=v{{ .Version }} bash

    # In Docker
    docker pull ghcr.io/manasseh-fikadu/bield:{{ .Version }}
    ```

    Verify a download with `sha256sum --check --ignore-missing checksums.txt`. To upgrade or roll back, see [Upgrading](https://github.com/manasseh-fikadu/bield/blob/v{{ .Version }}/docs/upgrading.md).
