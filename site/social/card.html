<!doctype html>
<!--
	The picture shown when a link to Bield is shared (public/social.png), at the size those previews
	want: 1200 by 630. It's drawn here so it uses the page's own type and colours. To change it,
	edit this file and run `make social`, which needs `make site` dependencies and Playwright's
	Chromium (`cd web && bunx playwright install chromium`).
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Bield social card</title>
		<style>
			@font-face {
				font-family: 'Host Grotesk';
				src: url('../node_modules/@fontsource-variable/host-grotesk/files/host-grotesk-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 300 800;
			}
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
					format('woff2');
				font-weight: 400;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				background: #0b0c0d;
				color: #ecedee;
				font-family: 'Host Grotesk', sans-serif;
				-webkit-font-smoothing: antialiased;
				overflow: hidden;
			}
			.card {
				position: relative;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				width: 1200px;
				height: 630px;
				padding: 64px 72px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
				font-size: 34px;
				font-weight: 600;
				letter-spacing: -0.015em;
			}
			h1 {
				font-size: 128px;
				font-weight: 500;
				line-height: 0.953;
				letter-spacing: -0.05em;
			}
			.dot {
				display: inline-block;
				width: 0.15em;
				height: 0.15em;
				margin-left: 0.03em;
				border-radius: 50%;
				background: #f5b544;
				box-shadow: 0 0 0.28em 0.02em rgb(245 181 68 / 0.28);
			}
			.foot {
				padding-top: 28px;
				border-top: 1px solid #222427;
			}
			.foot p {
				font-size: 28px;
				line-height: 1.3;
				color: #a6a9ad;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="brand">
				<svg width="38" height="38" viewBox="0 0 20 20" aria-hidden="true">
					<path
						d="M2.5 10.5 10 3l7.5 7.5"
						fill="none"
						stroke="#ecedee"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
					<circle cx="10" cy="13.5" r="3" fill="#f5b544" />
				</svg>
				Bield
			</div>
			<h1>Your whole tailnet,<br />on one page<span class="dot"></span></h1>
			<div class="foot">
				<p>One binary that joins your Tailscale or Headscale network.</p>
			</div>
		</div>
	</body>
</html>
