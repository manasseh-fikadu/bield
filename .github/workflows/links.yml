name: Links

# Requests the links from the site to other sites, which the build's own link check leaves out
# because it's slow and a page on someone else's site is sometimes down for a day. A failure here
# means a link to look at, not a broken build.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: Outside links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site/docs-site
      - run: bun run build
      - name: Request the outside links
        run: bun run links -- --external
