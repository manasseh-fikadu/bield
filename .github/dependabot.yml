version: 2

# Minor and patch updates come in one pull request per ecosystem; major updates
# get their own. A new release waits a week before Dependabot proposes it, which
# gives the ecosystem time to catch a compromised one. Security updates don't wait.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      web:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      site:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /site/docs-site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      docs-site:
        update-types: [minor, patch]
    # The docs site runs `astro check` in CI, which stops with "astro check does not
    # currently support TypeScript 7.0". Take this out when Astro's checker does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's base image, which is pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
